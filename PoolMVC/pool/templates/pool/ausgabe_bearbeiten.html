{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Pool-Verwaltung</title>
    <!-- CSS-Datei einbinden -->
    <link rel="stylesheet" href="{% static 'pool/css/style.css' %}">
</head>
<body>

    <div class="card">
        <h2>Ausgabe bearbeiten</h2>
        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="person_id">Wer hat gezahlt?</label>
                <select id="person_id" name="person_id" required>
                    {% for p in personen %}
                        <option value="{{ p.id }}" {% if p.id == ausgabe.person.id %}selected{% endif %}>
                            {{ p.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="betrag">Betrag (€):</label>
                <input type="number" id="betrag" name="betrag" step="0.01" min="0.01" value="{{ ausgabe.betrag }}" required>
            </div>

            <div class="form-group">
                <label for="beschreibung">Beschreibung:</label>
                <input type="text" id="beschreibung" name="beschreibung" value="{{ ausgabe.beschreibung }}" required>
            </div>

            <button type="submit">Änderungen speichern</button>
        </form>
        <a href="{% url 'thema_detail' ausgabe.thema.id %}" class="cancel-btn">Abbrechen</a>
    </div>

</body>
</html>
