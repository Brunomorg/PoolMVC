{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ausgabe bearbeiten — {{ thema.titel }}</title>
    <link rel="stylesheet" href="{% static 'pool/css/style.css' %}">
</head>
<body>


    <h1>Ausgabe bearbeiten</h1>

    <!-- FORMULAR: Ausgabe bearbeiten -->
    <div class="card">
        <h2>Details anpassen</h2>
        <form method="POST">
            {% csrf_token %}

            <div class="form-grid">
                <!-- Person auswählen -->
                <div class="form-group">
                    <label for="person_id">Wer hat gezahlt?</label>
                    <select id="person_id" name="person_id" required>
                        {% for p in personen %}
                            <option value="{{ p.id }}" {% if p.id == ausgabe.person.id %}selected{% endif %}>
                                {{ p.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Betrag -->
                <div class="form-group">
                    <label for="betrag">Betrag (€)</label>
                    <input type="number"
                           id="betrag"
                           name="betrag"
                           step="0.01"
                           min="0.01"
                           value="{{ ausgabe.betrag|stringformat:'.2f' }}"
                           placeholder="0.00"
                           required>
                </div>
            </div>

            <!-- Beschreibung -->
            <div class="form-group">
                <label for="beschreibung">Wofür? (Beschreibung)</label>
                <input type="text"
                       id="beschreibung"
                       name="beschreibung"
                       value="{{ ausgabe.beschreibung }}"
                       placeholder="z. B. Pool-Chlor"
                       required>
            </div>

            <!-- Aktions-Buttons -->
            <div style="display: flex; gap: 12px; margin-top: 20px;">
                <button type="submit" class="btn btn-primary">Änderungen speichern</button>
                <a href="{% url 'thema_detail' thema.id %}" class="btn btn-danger btn-sm">Abbrechen</a>
            </div>
        </form>
    </div>
 <div style="margin-bottom: 24px;">
        <a href="{% url 'thema_detail' thema.id %}" class="btn btn-primary btn-lg">
            &larr; Zurück zum Thema
        </a>
    </div>
</body>
</html>
