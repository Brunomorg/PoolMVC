{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ausgabe bearbeiten — {{ topic.titel }}</title>
    <link rel="stylesheet" href="{% static 'pool/css/style.css' %}">
</head>
<body>


    <h1>Ausgabe bearbeiten</h1>

    <!-- FORM: Edit expense -->
    <div class="card">
        <h2>Details anpassen</h2>
       <h2>Ausgabe bearbeiten</h2>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Person:</label>
                {{ form.person }}
            </div>
            <div class="form-group">
                <label>Betrag (€):</label>
                {{ form.betrag }}
            </div>
            <div class="form-group">
                <label>Beschreibung:</label>
                {{ form.beschreibung }}
            </div>

            <div style="margin-top: 15px;">
                <button type="submit" class="btn btn-primary">Speichern</button>
                <a href="{% url 'topic_detail' topic.id %}" class="btn btn-cancel">Abbrechen</a>
            </div>
        </form>
    </div>
 <div style="margin-bottom: 24px;">
        <a href="{% url 'topic_detail' topic.id %}" class="btn btn-primary btn-lg">
            &larr; Zurück zum Thema
        </a>
    </div>
</body>
</html>
